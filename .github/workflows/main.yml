name: Build APK
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install flet
      - run: flet build apk
      - uses: actions/upload-artifact@v3
        with:
          name: app-apk
          path: build/apk/app-release.apk
